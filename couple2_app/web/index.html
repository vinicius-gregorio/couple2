<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="couple2_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Plus Jakarta Sans files google_fonts fetches (400, 600, 700). -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="font" type="font/ttf" crossorigin href="https://fonts.gstatic.com/s/a/80501e2c94323d8b8d48b29bc73aa042539f0a6e62c3afe318980de7b7b19267.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin href="https://fonts.gstatic.com/s/a/ba0432c50b99a58d041dc19291e1ff0a3c0e17fa254fe58510a96248426718d6.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin href="https://fonts.gstatic.com/s/a/dbf8d18a2d1c11f9b68005f52aaefe3974273175b1048047d662a13858c1e9e6.ttf">

  <title>couple2_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FDFBF8;
    }
    #flutter-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #FDFBF8;
    }
    #flutter-splash .mark {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #9D174D;
      color: #FFFFFF;
      font: 700 36px/72px sans-serif;
      text-align: center;
    }
    #flutter-splash .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #E4DEE1;
      border-top-color: #9D174D;
      animation: flutter-splash-spin 0.8s linear infinite;
    }
    @keyframes flutter-splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="flutter-splash" aria-label="Carregando">
    <div class="mark">♥</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Dart removes #flutter-splash after the login font and Google mark are
    // ready. This timeout is the backstop if that never happens.
    setTimeout(function () {
      var splash = document.getElementById('flutter-splash');
      if (splash) splash.remove();
    }, 4000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

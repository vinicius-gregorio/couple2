<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="couple2_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>couple2_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FDFBF8;
    }
    #flutter-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #FDFBF8;
    }
    #flutter-splash .mark {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #9D174D;
      padding: 16px;
      box-sizing: border-box;
    }
    #flutter-splash .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #E4DEE1;
      border-top-color: #9D174D;
      animation: flutter-splash-spin 0.8s linear infinite;
    }
    @keyframes flutter-splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!--
    Heart and spinner are inline, so they paint before any font or network
    asset. Dart removes the splash after the login frame is ready. Waiting
    on the font only delays that removal.
  -->
  <div id="flutter-splash" aria-label="Carregando">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#FFFFFF" d="M12 21s-6.7-4.4-9.3-8.2C.7 10.2 1.1 6.5 4.2 5 6.3 4 8.5 4.5 12 8.1 15.5 4.5 17.7 4 19.8 5c3.1 1.5 3.5 5.2 1.5 7.8C18.7 16.6 12 21 12 21z"/>
    </svg>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

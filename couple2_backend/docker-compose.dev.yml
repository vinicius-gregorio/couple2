# This file used to start a standalone Postgres 16 container. That database
# did not match the Prisma datasource (the schema had drifted to SQLite), so
# the API could not boot against the intended database.
#
# Local Postgres now comes from the official Supabase stack. From the repo
# root:
#
#   supabase start
#
# Then run the API on the host (couple2_backend):
#
#   cp .env.example .env
#   npx prisma migrate deploy
#   npm run dev
#
# Or run the API in Docker, still against that Supabase Postgres:
#
#   docker compose up --build
#
# There is intentionally no database service in this file.
services: {}

# Nest API container. The database is the official local Supabase stack
# (`supabase start` from the repo root), not a second Postgres service.
#
# Supabase publishes Postgres on the host at port 54322. This container
# reaches it through host.docker.internal. Do not add a postgres service
# here — a separate database was the compose/datasource mismatch.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: couple2_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres?schema=public
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32b}
      PORT: 3000
      # Optional. Only POST /auth/firebase and PUSH_DRIVER=fcm need a service account.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # log (default) prints pushes. fcm sends them when credentials exist.
      PUSH_DRIVER: ${PUSH_DRIVER:-log}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/node_modules/.prisma
